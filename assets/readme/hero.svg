<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">哆啦A梦的家 Doraemon House 3D — 野比家 3D 图解</title>
  <desc id="desc">浅蓝天空底标题：哆啦A梦的家，副标题野比家新版动画间取还原；右侧是房屋结构分层展开示意：屋顶、二楼大雄房间、一楼客厅餐厨三层上下分离。</desc>

  <rect width="1200" height="360" rx="26" fill="#dceef7"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#2b4c7e">3D 图解 · THREE.JS 模型还原</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#1c2b3a">哆啦A梦的家</text>
    <text x="56" y="168" font-size="23" fill="#33475c">DORAEMON HOUSE 3D — 野比家，新版动画间取还原</text>
    <text x="56" y="204" font-size="19" fill="#4a5a6a">东京练马区月见台，两层木造小楼约 84㎡，5 张渲染图。</text>
    <g id="chips" font-size="18" fill="#2b4c7e" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#b8d4e8" stroke-width="1.5"/><text x="119" y="262">5 张渲染图</text></g>
      <g><rect x="194" y="238" width="168" height="36" rx="18" fill="#ffffff" stroke="#b8d4e8" stroke-width="1.5"/><text x="278" y="262">109 个命名部件</text></g>
      <g><rect x="374" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#b8d4e8" stroke-width="1.5"/><text x="437" y="262">新版动画考据</text></g>
      <g><rect x="512" y="238" width="150" height="36" rx="18" fill="#ffffff" stroke="#b8d4e8" stroke-width="1.5"/><text x="587" y="262">3DK · 约 84㎡</text></g>
    </g>
  </g>

  <g id="house-diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- labels first: they sit on the light sky background, not on the dark shapes below -->
    <g id="labels" font-size="18" fill="#2b4c7e" text-anchor="middle">
      <text x="980" y="44">屋顶 · 深灰瓦 + 鬼瓦脊饰</text>
      <text x="980" y="134">2F · 大雄房间 + 和室</text>
      <text x="980" y="234">1F · 客厅 + 餐厨 + 卫浴</text>
    </g>
    <!-- roof -->
    <polygon points="800,112 1160,112 1096,64 864,64" fill="#3a4152" stroke="#232838" stroke-width="2"/>
    <rect x="940" y="54" width="80" height="12" rx="4" fill="#232838"/>
    <line x1="830" y1="104" x2="880" y2="72" stroke="#565e70" stroke-width="2"/>
    <line x1="880" y1="104" x2="930" y2="72" stroke="#565e70" stroke-width="2"/>
    <line x1="1030" y1="104" x2="1080" y2="72" stroke="#565e70" stroke-width="2"/>
    <line x1="1080" y1="104" x2="1130" y2="72" stroke="#565e70" stroke-width="2"/>
    <!-- antenna on the right roof slope, clear of the roof label -->
    <line x1="1130" y1="89" x2="1130" y2="45" stroke="#4a5a6a" stroke-width="3"/>
    <line x1="1118" y1="54" x2="1142" y2="54" stroke="#4a5a6a" stroke-width="2.5"/>
    <line x1="1118" y1="64" x2="1142" y2="64" stroke="#4a5a6a" stroke-width="2.5"/>
    <line x1="1118" y1="74" x2="1142" y2="74" stroke="#4a5a6a" stroke-width="2.5"/>
    <!-- guides roof -> 2F -->
    <line x1="850" y1="116" x2="850" y2="138" stroke="#8fa8bc" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="1110" y1="116" x2="1110" y2="138" stroke="#8fa8bc" stroke-width="2" stroke-dasharray="5 5"/>
    <!-- 2F -->
    <rect x="830" y="140" width="300" height="66" rx="4" fill="#f7f1e5" stroke="#6b5136" stroke-width="2"/>
    <rect x="856" y="158" width="48" height="34" fill="#4a3525"/>
    <line x1="856" y1="169" x2="904" y2="169" stroke="#f7f1e5" stroke-width="2"/>
    <line x1="856" y1="180" x2="904" y2="180" stroke="#f7f1e5" stroke-width="2"/>
    <rect x="956" y="158" width="48" height="34" fill="#4a3525"/>
    <line x1="956" y1="169" x2="1004" y2="169" stroke="#f7f1e5" stroke-width="2"/>
    <line x1="956" y1="180" x2="1004" y2="180" stroke="#f7f1e5" stroke-width="2"/>
    <rect x="1056" y="158" width="48" height="34" fill="#4a3525"/>
    <line x1="1056" y1="169" x2="1104" y2="169" stroke="#f7f1e5" stroke-width="2"/>
    <line x1="1056" y1="180" x2="1104" y2="180" stroke="#f7f1e5" stroke-width="2"/>
    <!-- guides 2F -> 1F -->
    <line x1="850" y1="210" x2="850" y2="248" stroke="#8fa8bc" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="1110" y1="210" x2="1110" y2="248" stroke="#8fa8bc" stroke-width="2" stroke-dasharray="5 5"/>
    <!-- 1F -->
    <rect x="830" y="252" width="300" height="66" rx="4" fill="#f7f1e5" stroke="#6b5136" stroke-width="2"/>
    <rect x="856" y="270" width="48" height="34" fill="#4a3525"/>
    <line x1="856" y1="281" x2="904" y2="281" stroke="#f7f1e5" stroke-width="2"/>
    <line x1="856" y1="292" x2="904" y2="292" stroke="#f7f1e5" stroke-width="2"/>
    <rect x="956" y="264" width="48" height="54" fill="#4a3525"/>
    <circle cx="996" cy="292" r="3" fill="#f5c518"/>
    <rect x="1056" y="270" width="48" height="34" fill="#4a3525"/>
    <line x1="1056" y1="281" x2="1104" y2="281" stroke="#f7f1e5" stroke-width="2"/>
    <line x1="1056" y1="292" x2="1104" y2="292" stroke="#f7f1e5" stroke-width="2"/>
    <!-- trees -->
    <g transform="translate(792 300)"><rect x="-3" y="0" width="6" height="18" fill="#6b5136"/><circle cx="0" cy="-8" r="16" fill="#5aa85a"/><circle cx="10" cy="-16" r="11" fill="#6fbf6f"/></g>
    <g transform="translate(1168 300)"><rect x="-3" y="0" width="6" height="18" fill="#6b5136"/><circle cx="0" cy="-8" r="16" fill="#5aa85a"/><circle cx="-10" cy="-16" r="11" fill="#6fbf6f"/></g>
  </g>
</svg>
